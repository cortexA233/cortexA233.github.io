<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cortexA233</title>
  <link rel="canonical" href="https://cortexa233.github.io/en/">
<link rel="alternate" hreflang="zh" href="https://cortexa233.github.io/zh/">
<link rel="alternate" hreflang="en" href="https://cortexa233.github.io/en/">
<link rel="alternate" hreflang="ja" href="https://cortexa233.github.io/ja/">
<link rel="alternate" hreflang="x-default" href="https://cortexa233.github.io/en/">

  <script>
    (function () {
      var supported = ["zh", "en", "ja"];
      var def = "en";
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      if (supported.indexOf(lang) === -1) {
        lang = null;
        var navs = navigator.languages || [navigator.language || ''];
        for (var i = 0; i < navs.length; i++) {
          var code = (navs[i] || '').toLowerCase().split('-')[0];
          if (supported.indexOf(code) !== -1) { lang = code; break; }
        }
      }
      if (!lang) lang = def;
      location.replace('/' + lang + '/');
    })();
  </script>
</head>
<body>
  <p>Redirecting… <a href="/en/">Enter</a></p>
  <noscript>

    <a href="/zh/" lang="zh" hreflang="zh">中文</a>

    <a href="/en/" lang="en" hreflang="en">English</a>

    <a href="/ja/" lang="ja" hreflang="ja">日本語</a>

  </noscript>
</body>
</html>
